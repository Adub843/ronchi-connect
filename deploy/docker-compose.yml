# Everything Ronchi Connect needs on one small Linux server:
#   caddy   HTTPS for the website and the app's WebSocket (certificates are automatic)
#   server  the Ronchi Connect server
#   coturn  the relay used when two computers cannot reach each other directly
#
# Usage:  cp .env.example .env   (fill it in)   then   docker compose up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TURN_HOST: ${DOMAIN:?set DOMAIN in .env}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    volumes:
      - ./data:/data
      - ./downloads:/downloads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking so the relay can use its UDP port range without Docker's NAT in the way.
    network_mode: host
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      # Never relay into private networks: the relay must not become a way into this server's own network.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255

volumes:
  caddy_data:
  caddy_config:
