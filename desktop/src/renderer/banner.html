<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Ronchi Connect session</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;
      font: 600 13px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #fff; background: linear-gradient(180deg, #d4121a, #a80c13);
      -webkit-app-region: drag; user-select: none;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; flex: none; }
    @keyframes pulse { 50% { opacity: .25; } }
    #text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button {
      -webkit-app-region: no-drag; font: inherit; border: 1px solid rgba(255,255,255,.55); border-radius: 6px;
      padding: 6px 10px; color: #fff; background: rgba(0,0,0,.18); cursor: pointer; white-space: nowrap;
    }
    button:hover { background: rgba(0,0,0,.35); }
    #end { background: #fff; color: #a80c13; border-color: #fff; }
    #end:hover { background: #ffe9ea; }
  </style>
</head>
<body>
  <span class="dot"></span>
  <span id="text">A Ronchi technician can see this screen</span>
  <button id="control" type="button">Pause control</button>
  <button id="end" type="button">End session</button>
  <script src="js/banner.js"></script>
</body>
</html>
